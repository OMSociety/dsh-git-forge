name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: 冒烟测试
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 准备 Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # 零运行时依赖：测试只引用 Node 内置模块与本仓源码，因此没有安装步骤。
      - name: 语法与冒烟测试
        run: npm run check

      - name: 发布物清单
        run: npm run check:pack
