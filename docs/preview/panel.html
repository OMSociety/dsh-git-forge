					return ctx.locale.subscribe(cb);
				}, [ctx]),
				React.useCallback(function () {
					try {
						return ctx.locale && ctx.locale.getSnapshot ? ctx.locale.getSnapshot().active : activeLocale();
					} catch (e) {
						return activeLocale();
					}
				}, [ctx]),
				function () { return "en"; },
			);
			return React.createElement(ForgePanel, {
				key: "git-forge-" + String(localeKey || "en"),
				visible: props.visible,
				key: props.sessionId || "unbound",
				sessionId: props.sessionId,
			});
		}

		// 服务级依赖：slots 是核心槽位服务（右侧栏正文与标题都注册进它），locale 供 ctx.locale 用。
		const inject = ["locale", "slots"];
		const TAB_KIND = "git-forge";

		function apply(ctx) {
			ctx.effect(function () {
				return ensureStyles();
			}, "dsh-git-forge: styles");
			if (ctx.locale) {
				attachLocale(ctx.locale);
				ctx.effect(function () {
					const offZh = ctx.locale.register(LOCALE_NS, "zh", zh);
					const offEn = ctx.locale.register(LOCALE_NS, "en", en);
					return function () {
						try { offZh(); } catch (e) {}
						try { offEn(); } catch (e) {}
					};
				}, "dsh-git-forge: dictionaries");
			}

			// 座位正文：props 是框架注入的平铺 owner props（sessionId 等），
			// 可见性读座位自己的 tab.visible。
			function ForgeBody(props) {
				const tab = props.useTabInfo().tab;
				return React.createElement(ForgeRoot, {
					ctx: ctx,
					visible: tab.visible,
					key: props.sessionId || "unbound",
				sessionId: props.sessionId,
				});
			}

			// 座位标题（chip）：图标 + 文字。
			// 宿主管这份内容放进 chip 自己的 flex 行（`.tabTitle` 为 `display: contents`），
			// 所以包装层要自己居中图标；行内包装会让 svg 落在文字基线上。
			function ForgeTitle() {
				return React.createElement("span", {
					style: { display: "inline-flex", alignItems: "center", gap: "5px" },
				}, icon(14), t("tabTitle"));
			}

			ctx.inject(["sidebarRightTabs"], function (injected) {
				const tabs = pick(injected, "sidebarRightTabs");
				if (!tabs || typeof tabs.register !== "function") return;   // 宿主没有右侧栏：静默不挂，不拖垮插件

				const disposers = [];
				disposers.push(tabs.register({
					id: TAB_ID,
					kind: TAB_KIND,
					priority: "extension",
					title: function () { return t("tabTitle"); },
					guide: [{
						id: "main",
						order: 46,
						title: function () { return t("tabTitle"); },
						description: function () { return t("guideDesc"); },
						icon: function (p) { return icon((p && p.size) || 16); },
					}],
				}));

				const slots = ctx.slots;
				if (slots && typeof slots.inject === "function") {
					disposers.push(slots.inject("sidebar.right.pane.tab", function () {
						return slots.register({ name: "sidebar.right.pane.tab", key: TAB_ID }, ForgeBody);
					}));
					disposers.push(slots.inject("sidebar.right.pane.tab.title", function () {
						return slots.register({ name: "sidebar.right.pane.tab.title", key: TAB_ID }, ForgeTitle);
					}));
				}

				return function () {
					for (let i = disposers.length - 1; i >= 0; i--) {
						try { disposers[i](); } catch (e) {}
					}
				};
			});
		}
		exports.apply = apply;
		exports.inject = inject;
		return module.exports;
	},
});
</script>
  <script>window.__startPreview()</script>
